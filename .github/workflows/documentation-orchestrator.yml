name: Centralized Documentation Orchestrator

on:
  schedule:
    # Runs at 00:00 UTC every day and scans every repo it discovers/lists.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (check changes without pushing or creating PRs)'
        type: boolean
        required: false
        default: false
      provider:
        description: 'LLM Provider to force (leave empty to auto-detect)'
        type: choice
        required: false
        options:
          - ''
          - 'gemini'
          - 'claude'

permissions:
  contents: read

concurrency:
  # Prevents two runs (e.g. a manual run overlapping the scheduled one) from
  # racing on the same docs/readme-update branch (orchestrator.py force-pushes it).
  group: documentation-orchestrator
  cancel-in-progress: false

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Orchestrator Script
        env:
          ORCHESTRATOR_PAT: ${{ secrets.ORCHESTRATOR_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.provider }}" ]; then
            ARGS="$ARGS --provider ${{ github.event.inputs.provider }}"
          fi
          python orchestrator.py $ARGS
          # To go back to the fixed repositories.json list instead of
          # auto-discovery, just remove --auto-discover from ARGS above.
